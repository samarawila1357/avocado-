<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledger &amp; Pulse | Financial Insights &amp; Market News</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #059669;
      --accent-hover: #047857;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* Market Ticker */
    .ticker {
      background: var(--primary);
      color: #f1f5f9;
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
      display: flex;
      gap: 2rem;
      overflow-x: auto;
      white-space: nowrap;
    }
    .up { color: #34d399; font-weight: 600; }
    .down { color: #f87171; font-weight: 600; }

    /* Header & Navigation */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }
    nav button {
      background: none;
      border: none;
      margin-left: 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      transition: 0.2s;
    }
    nav button:hover, nav button.active {
      background: #ecfdf5;
      color: var(--accent);
    }

    /* Container */
    .container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* Hero Featured Article */
    .hero {
      background: var(--primary);
      color: white;
      border-radius: 12px;
      padding: 2.5rem;
      margin-bottom: 2.5rem;
      display: grid;
      gap: 1rem;
    }
    .badge {
      display: inline-block;
      background: var(--accent);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      width: fit-content;
    }
    .hero h1 { font-size: 2rem; line-height: 1.25; }
    .hero p { color: #cbd5e1; max-width: 700px; }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: fit-content;
      transition: 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }

    /* Article Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }
    .card-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
    }
    .card h3 {
      font-size: 1.2rem;
      margin-bottom: 0.75rem;
      color: var(--primary);
    }
    .card p {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }
    .read-link {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Newsletter */
    .newsletter {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 12px;
      padding: 2rem;
      margin-top: 3rem;
      text-align: center;
    }
    .newsletter form {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .newsletter input {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 280px;
      font-size: 0.95rem;
    }

    /* Article Reader Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      justify-content: center;
      align-items: center;
      padding: 1rem;
      z-index: 50;
    }
    .modal {
      background: white;
      max-width: 700px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 2rem;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1.25rem;
      font-size: 1.5rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
    }
    .modal h2 { margin: 0.75rem 0; color: var(--primary); }
    .modal-body p { margin-bottom: 1rem; color: var(--text); }

    footer {
      text-align: center;
      padding: 2rem;
